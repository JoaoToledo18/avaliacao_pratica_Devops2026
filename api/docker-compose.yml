services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cursos
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: app
      DB_PASSWORD: app123
      DB_NAME: cursos
      WEB_ORIGIN: ${WEB_ORIGIN}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados_mysql:

#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - default
  - name: aluno
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_key}

ssh_pwauth: false
disable_root: true

package_update: true
packages:
  - docker.io
  - docker-compose-v2

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker aluno

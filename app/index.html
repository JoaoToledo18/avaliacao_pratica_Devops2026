<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Cursos</title>
  <script src="config.js"></script>
</head>
<body>
  <h1>Cadastro de Cursos</h1>

  <form id="form">
    <p>Nome do curso: <input name="nome" required></p>
    <p>Instrutor responsável: <input name="instrutor" required></p>
    <p>Preço: <input name="preco" type="number" step="0.01" min="0" required></p>
    <p>Quantidade de vagas: <input name="vagas" type="number" step="1" min="0" required></p>
    <button type="submit">Cadastrar</button>
  </form>
  <p id="msg"></p>

  <a href="#" id="listar">Listar todos os cursos</a>
  <ul id="lista"></ul>

  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const dados = Object.fromEntries(new FormData(e.target));
      const r = await fetch(API_URL + '/curso', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });
      document.getElementById('msg').textContent = r.ok ? 'Curso cadastrado!' : 'Erro ao cadastrar';
      if (r.ok) e.target.reset();
    };

    document.getElementById('listar').onclick = async (e) => {
      e.preventDefault();
      const cursos = await (await fetch(API_URL + '/cursos')).json();
      const ul = document.getElementById('lista');
      ul.innerHTML = '';
      cursos.forEach(c => {
        const li = document.createElement('li');
        li.textContent = `${c.nome} - ${c.instrutor} - R$ ${c.preco} - ${c.vagas} vagas`;
        ul.appendChild(li);
      });
    };
  </script>
</body>
</html>
